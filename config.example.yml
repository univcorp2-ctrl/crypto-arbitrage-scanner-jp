market: BTC/JPY
min_net_bps: 5
request_timeout_seconds: 8

exchanges:
  bitbank:
    enabled: true
    pair: btc_jpy
    taker_fee_bps: 10
  gmocoin:
    enabled: true
    pair: BTC
    taker_fee_bps: 5
  bitflyer:
    enabled: true
    pair: BTC_JPY
    taker_fee_bps: 15
  coincheck:
    enabled: true
    pair: btc_jpy
    taker_fee_bps: 0

# The web paper engine reads these values from environment variables so they can
# be changed without committing operational settings or secrets.
paper:
  min_net_bps: 12
  max_trade_jpy: 50000
  min_trade_jpy: 2000
  slippage_bps: 2
  rebalance_reserve_bps: 3
  interval_seconds: 30
