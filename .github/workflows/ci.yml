name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,web]'
      - name: Lint and format check
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Test
        run: pytest
      - name: Validate scheduled runner
        run: python -m py_compile scripts/run_paper_dashboard.py
      - name: Validate dashboard JavaScript
        run: |
          node --check docs/assets/app.js
          node --check src/arbscanner/static/app.js
      - name: Validate dashboard JSON
        run: python -m json.tool docs/data/dashboard.json >/dev/null
