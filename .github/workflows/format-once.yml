name: Format Once

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-once
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: python -m pip install 'ruff>=0.4,<1'

      - name: Apply safe lint fixes
        run: ruff check . --fix --unsafe-fixes || true

      - name: Format Python
        run: ruff format .

      - name: Verify lint
        run: ruff check .

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py'
          if git diff --cached --quiet; then
            echo "No formatting changes."
          else
            git commit -m "style: format paper trading implementation"
            git push
          fi
