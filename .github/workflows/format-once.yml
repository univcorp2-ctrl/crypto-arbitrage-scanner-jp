name: Format Once

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-once
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: python -m pip install 'ruff>=0.4,<1'

      - name: Format and capture diagnostics
        run: |
          set +e
          ruff check . --fix --unsafe-fixes > ruff-fix.log 2>&1
          ruff format . > ruff-format.log 2>&1
          ruff check . > ruff-check.log 2>&1
          cat ruff-fix.log ruff-format.log ruff-check.log
          exit 0

      - name: Commit formatting and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py' ruff-fix.log ruff-format.log ruff-check.log
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "style: format paper trading implementation"
            git push
          fi
