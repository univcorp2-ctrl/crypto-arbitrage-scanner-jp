name: Arb Scanner - Schedule and Notify

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Copy default config
        run: cp config.example.yml config.yml

      - name: Run arbitrage scan
        id: scan
        run: |
          mkdir -p artifacts
          set +e
          OUTPUT=$(arbscan --config config.yml --market BTC/JPY --min-net-bps 5 2>&1)
          EXIT=$?
          printf '%s\n' "$OUTPUT" > artifacts/latest-scan.txt
          {
            echo "result<<ARB_SCAN_OUTPUT"
            echo "$OUTPUT"
            echo "ARB_SCAN_OUTPUT"
            echo "exit_code=$EXIT"
          } >> "$GITHUB_OUTPUT"
          echo "$OUTPUT"

      - name: Notify Telegram via Cloudflare Worker
        if: always()
        env:
          CF_SECRET: ${{ secrets.CF_WORKER_SECRET }}
          SCAN_EXIT: ${{ steps.scan.outputs.exit_code }}
          SCAN_RESULT: ${{ steps.scan.outputs.result }}
        run: |
          if [ "$SCAN_EXIT" != "0" ]; then
            STATUS="ERROR arb-scan-failed"
          elif echo "$SCAN_RESULT" | grep -qi "Opportunity"; then
            STATUS="ALERT arb-opportunity-found"
          else
            STATUS="OK scan-complete-no-opportunity"
          fi
          FIRST=$(echo "$SCAN_RESULT" | head -8)
          ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$STATUS: $FIRST")
          if [ -n "$CF_SECRET" ]; then
            curl -sf "https://x-realestate-autopost.univcorp2.workers.dev/telegram?msg=$ENCODED&secret=$CF_SECRET" || true
          fi

      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arb-scan-${{ github.run_number }}
          path: artifacts/latest-scan.txt
          retention-days: 7

      - name: Fail when scanner failed
        if: always() && steps.scan.outputs.exit_code != '0'
        run: exit 1
