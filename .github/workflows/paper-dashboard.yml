name: Paper Trading Dashboard

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trading-dashboard
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Prepare scanner config
        run: cp config.example.yml config.yml

      - name: Run one public-orderbook paper cycle
        run: python scripts/run_paper_dashboard.py

      - name: Validate generated ledger
        run: |
          python -m json.tool data/paper_state.json >/dev/null
          python -m json.tool docs/data/dashboard.json >/dev/null
          git diff --check

      - name: Persist paper ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper_state.json docs/data/dashboard.json
          if git diff --cached --quiet; then
            echo "No paper state changes."
          else
            git commit -m "chore: update paper trading snapshot"
            git push
          fi
