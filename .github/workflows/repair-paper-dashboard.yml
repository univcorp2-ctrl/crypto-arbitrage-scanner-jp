name: Repair Paper Dashboard Once

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-paper-dashboard-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch scheduled runner and static labels
        run: |
          python - <<'PY'
          from pathlib import Path

          runner = Path("scripts/run_paper_dashboard.py")
          text = runner.read_text(encoding="utf-8")
          text = text.replace(
              "from arbscanner.paper import (",
              "from arbscanner.paper_ledger import (",
          )
          text = text.replace('"GMO_API_KEY"', '"GMO_COIN_API_KEY"')
          text = text.replace('"GMO_API_SECRET"', '"GMO_COIN_API_SECRET"')
          text = text.replace(
              'settings.get("min_net_bps"), "5"',
              'settings.get("min_net_bps"), "12"',
          )
          text = text.replace(
              'settings.get("max_trade_jpy"), "100000"',
              'settings.get("max_trade_jpy"), "50000"',
          )
          text = text.replace(
              'settings.get("min_trade_jpy"), "5000"',
              'settings.get("min_trade_jpy"), "2000"',
          )

          if "has_cross_venue_data = len(books) >= 2" not in text:
              text = text.replace(
                  "    existing_state = _load_state()",
                  "    has_cross_venue_data = len(books) >= 2\n"
                  "    snapshot_source = (\n"
                  "        \"public_orderbook_paper\"\n"
                  "        if has_cross_venue_data\n"
                  "        else \"public_orderbook_unavailable\"\n"
                  "    )\n"
                  "    snapshot_data_status = (\n"
                  "        \"seeded_demo_plus_live_public\"\n"
                  "        if has_cross_venue_data\n"
                  "        else \"seeded_demo\"\n"
                  "    )\n"
                  "    existing_state = _load_state()",
                  1,
              )

          text = text.replace(
              '    execution_reason = "no_eligible_opportunity"',
              "    execution_reason = (\n"
              "        \"no_eligible_opportunity\"\n"
              "        if has_cross_venue_data\n"
              "        else \"insufficient_public_orderbooks\"\n"
              "    )",
              1,
          )
          text = text.replace(
              '            "source": "public_orderbook_paper",',
              '            "source": snapshot_source,',
              1,
          )
          text = text.replace(
              '            "data_status": "seeded_demo_plus_live_public",',
              '            "data_status": snapshot_data_status,',
              1,
          )
          text = text.replace(
              '"status": "degraded" if errors else "healthy"',
              '"status": "degraded" if errors or not has_cross_venue_data else "healthy"',
          )
          text = text.replace(
              '"run_status": "degraded" if errors else "healthy"',
              '"run_status": "degraded" if errors or len(books) < 2 else "healthy"',
          )
          runner.write_text(text, encoding="utf-8")

          if "from arbscanner.paper_ledger import (" not in text:
              raise SystemExit("paper ledger compatibility import was not applied")
          if "GMO_COIN_API_KEY" not in text or "GMO_COIN_API_SECRET" not in text:
              raise SystemExit("GMO Coin environment variable names were not applied")
          if '"source": snapshot_source' not in text:
              raise SystemExit("snapshot source guard was not applied")

          app = Path("docs/assets/app.js")
          app_text = app.read_text(encoding="utf-8")
          if "insufficient_public_orderbooks" not in app_text:
              app_text = app_text.replace(
                  '    missing_orderbook: "板データ不足",',
                  '    missing_orderbook: "板データ不足",\n'
                  '    insufficient_public_orderbooks: "公開板が2取引所未満",',
              )
          app.write_text(app_text, encoding="utf-8")
          PY

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,web]'

      - name: Validate code and generate first snapshot
        id: validate
        run: |
          set +e
          LOG=/tmp/repair-validation.log
          : > "$LOG"
          FAILED=0
          run_check() {
            NAME="$1"
            shift
            echo "===== $NAME =====" >> "$LOG"
            "$@" >> "$LOG" 2>&1
            STATUS=$?
            echo "EXIT_CODE=$STATUS" >> "$LOG"
            echo >> "$LOG"
            if [ "$STATUS" -ne 0 ]; then
              FAILED=1
            fi
          }
          run_check ruff-fix ruff check src tests scripts --fix --unsafe-fixes
          run_check ruff-format ruff format src tests scripts
          run_check ruff-check ruff check src tests scripts
          run_check ruff-format-check ruff format --check src tests scripts
          run_check pytest pytest
          run_check py-compile python -m py_compile scripts/run_paper_dashboard.py
          run_check docs-js node --check docs/assets/app.js
          run_check dynamic-js node --check src/arbscanner/static/app.js
          cp config.example.yml config.yml
          run_check first-paper-snapshot python scripts/run_paper_dashboard.py
          run_check state-json python -m json.tool data/paper_state.json
          run_check dashboard-json python -m json.tool docs/data/dashboard.json
          run_check whitespace git diff --check
          rm -f config.yml
          cat "$LOG"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Persist diagnostics when validation fails
        if: steps.validate.outputs.failed == '1'
        run: |
          cp /tmp/repair-validation.log /tmp/saved-repair-validation.log
          git reset --hard HEAD
          git clean -fd
          cp /tmp/saved-repair-validation.log repair-validation.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repair-validation.log
          git commit -m "chore: capture repair validation failure"
          git push
          exit 1

      - name: Commit verified operation state and remove temporary files
        if: steps.validate.outputs.failed == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch \
            .github/workflows/format-once.yml \
            .github/workflows/repair-paper-dashboard.yml \
            repair-diagnostics.log \
            repair-validation.log \
            ruff-check.log \
            ruff-fix.log \
            ruff-format.log
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes remain."
          else
            git commit -m "fix: activate verified paper dashboard cycle"
            git push
          fi
