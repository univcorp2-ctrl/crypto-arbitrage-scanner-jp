name: Repair Paper Dashboard Once

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-paper-dashboard-once
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,web]'

      - name: Capture bounded diagnostics
        run: |
          set +e
          LOG=/tmp/repair-diagnostics.log
          : > "$LOG"
          run_check() {
            NAME="$1"
            shift
            echo "===== $NAME =====" >> "$LOG"
            "$@" >> "$LOG" 2>&1
            STATUS=$?
            echo "EXIT_CODE=$STATUS" >> "$LOG"
            echo >> "$LOG"
          }
          run_check ruff-fix ruff check src tests scripts --fix --unsafe-fixes
          run_check ruff-format ruff format src tests scripts
          run_check ruff-check ruff check src tests scripts
          run_check ruff-format-check ruff format --check src tests scripts
          run_check pytest pytest
          run_check py-compile python -m py_compile scripts/run_paper_dashboard.py
          run_check docs-js node --check docs/assets/app.js
          run_check dynamic-js node --check src/arbscanner/static/app.js
          git reset --hard HEAD
          cp "$LOG" repair-diagnostics.log
          cat repair-diagnostics.log

      - name: Commit diagnostics only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repair-diagnostics.log
          if git diff --cached --quiet; then
            echo "No diagnostic change."
          else
            git commit -m "chore: capture repair diagnostics"
            git push
          fi
