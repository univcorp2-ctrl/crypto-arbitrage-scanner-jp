name: Format multivenue rollout

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install formatter
        run: pip install 'ruff>=0.6,<1'
      - name: Format and autofix
        run: |
          ruff check --fix src/arbscanner/funding/multivenue.py src/arbscanner/multivenue_web.py tests/test_multivenue_funding.py tests/test_multivenue_adapter.py tests/test_multivenue_web.py
          ruff format src/arbscanner/funding/multivenue.py src/arbscanner/multivenue_web.py tests/test_multivenue_funding.py tests/test_multivenue_adapter.py tests/test_multivenue_web.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/arbscanner/funding/multivenue.py src/arbscanner/multivenue_web.py tests/test_multivenue_funding.py tests/test_multivenue_adapter.py tests/test_multivenue_web.py
          git commit -m 'style: format multivenue funding implementation'
          git push origin main
