[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-arbitrage-scanner-jp"
version = "0.2.0"
description = "JPY crypto arbitrage scanner with a production-like paper-trading dashboard."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "GitHub-GPT Syncer" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.4,<1",
]

[project.scripts]
arbscan = "arbscanner.cli:main"
arbweb = "arbscanner.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arbscanner = ["static/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
