[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-arbitrage-scanner-jp"
version = "0.4.0"
description = "Japan-focused spot and multi-venue funding-rate arbitrage research, guarded execution, and operations control plane."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "GitHub-GPT Syncer" }]
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  "ccxt>=4.5,<5",
]
[project.optional-dependencies]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "cryptography>=43,<47",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "cryptography>=43,<47",
]

[project.scripts]
arbscan = "arbscanner.cli:main"
arbweb = "arbscanner.web:main"
fundingweb = "arbscanner.funding_web:main"
fundingsnapshot = "arbscanner.funding.cli:main"
fundingmulti = "arbscanner.multivenue_web:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
arbscanner = [
  "static/*.html",
  "static/*.css",
  "static/*.js",
  "funding_static/*.html",
  "funding_static/*.css",
  "funding_static/*.js",
  "multivenue_static/*.html",
  "multivenue_static/*.css",
  "multivenue_static/*.js",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
